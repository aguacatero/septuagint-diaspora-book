name: README progress consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify README milestone count and progress SVG
        run: python3 scripts/update_progress.py --check
