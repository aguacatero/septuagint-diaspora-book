name: README progress consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify README milestone count and progress SVG
        run: python3 scripts/update_progress.py --check
      - name: Test public provisional research checkpoint safeguards
        run: python3 -m unittest discover -s tests -p test_sync_public_draft_status.py -v
      - name: Exercise safe public checkpoint from the live GitHub PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_public_draft_status.py
          python3 scripts/sync_public_draft_status.py --check
